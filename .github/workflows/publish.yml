name: Publish

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    if: github.repository == 'grlt-hub/react-slots'
    name: Stage React-Slots release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: Release
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set node version to 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          # disable cache to avoid cache poisoning
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run build
        run: pnpm build

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      # pnpm 11 implements staged publishing natively; no npm CLI upgrade is needed.
      - name: Stage packages on npm
        run: pnpm run publish-ci "${GITHUB_REF_NAME}"

      - name: Explain npm approval
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## npm approval required

          This workflow stages releases; it does not make them publicly available.
          Open **Staged Packages** on [npmjs.com](https://www.npmjs.com/), review
          `@grlt-hub/react-slots` and `@grlt-hub/eslint-plugin-react-slots`, and approve
          each package with 2FA. Stage IDs are printed in the staging step above.

          You can also approve each stage locally with `pnpm stage approve <stage-id>`.
          Approval publishes the uploaded artifact with its CI provenance; no rebuild is needed.
          EOF
