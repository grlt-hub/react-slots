name: Publish

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    if: github.repository == 'grlt-hub/react-slots'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read

  publish:
    needs: build
    name: Publish React-Slots
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: Release
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts

      - name: Set node version to 26
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Stage packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/publish-ci/dist/index.mjs "$GITHUB_REF_NAME" "release/grlt-hub-react-slots-${version}.tgz"
          node scripts/publish-ci/dist/index.mjs "$GITHUB_REF_NAME" "release/grlt-hub-eslint-plugin-react-slots-${version}.tgz"
