name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release type
        required: true
        default: patch
        type: choice
        options:
          - next
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
      version:
        description: Exact version (overrides release type)
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/install

      - name: Create branch and update version
        env:
          RELEASE_TYPE: ${{ inputs.release }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          RELEASE_INPUT="${RELEASE_VERSION:-$RELEASE_TYPE}"
          PREPARE_BRANCH="release/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$PREPARE_BRANCH"
          git config user.name "react-slots-release-bot[bot]"
          git config user.email "336868351+react-slots-release-bot[bot]@users.noreply.github.com"
          pnpm exec bumpp package.json 'packages/*/package.json' \
            --release "$RELEASE_INPUT" --yes \
            --commit 'chore: release v%s' --no-tag --no-push

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_GITHUB_APP_ID }}
          private-key: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open release PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          PREPARE_BRANCH="$(git branch --show-current)"
          VERSION="$(jq -r .version package.json)"
          git push -u "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD
          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$PREPARE_BRANCH" \
            --title "chore: release v$VERSION" \
            --body "Prepare release v$VERSION"
